<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
</head>
<body>
    


    <h4>Botones de Aumento y Disminución</h4> <br>
    <input type="button" value="Aumentar" onclick="incrementar()">
    <!-- El atributo "ONCLICK" llama a la función "INCREMENTAR" definida en el archivo JS-->

    <input type="button" value="Disminuir" onclick="decrementar()">
    <!-- El atributo "ONCLICK" llama a la función "DECREMENTAR" definida en el archivo JS-->

    <script src="contador.js"></script>


</body>
</html>
